<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Login | UAN Control Pro</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

<style>

body{

margin:0;

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:linear-gradient(135deg,#198754,#145c32);

font-family:Segoe UI,sans-serif;

}

.card-login{

width:420px;

background:white;

padding:45px;

border-radius:22px;

box-shadow:0 20px 50px rgba(0,0,0,.25);

}

.logo{

font-size:70px;

text-align:center;

margin-bottom:10px;

}

h2{

font-weight:700;

text-align:center;

}

.sub{

text-align:center;

color:#666;

margin-bottom:30px;

}

.btn-success{

padding:12px;

font-weight:600;

border-radius:12px;

}

.footer{

margin-top:25px;

text-align:center;

font-size:12px;

color:#999;

}

</style>

</head>

<body>

<div class="card-login">

<div class="logo">🏥</div>

<h2>UAN Control Pro</h2>

<div class="sub">

Sistema Inteligente de Estoque

</div>

{% with mensagens = get_flashed_messages(with_categories=true) %}
{% if mensagens %}
{% for categoria,mensagem in mensagens %}

<div class="alert alert-{{categoria}}">

{{mensagem}}

</div>

{% endfor %}
{% endif %}
{% endwith %}

<form method="POST">

<div class="mb-3">

<label>E-mail</label>

<input
type="email"
name="email"
class="form-control"
placeholder="admin@uan.com"
required>

</div>

<div class="mb-4">

<label>Senha</label>

<input
type="password"
name="senha"
class="form-control"
placeholder="******"
required>

</div>

<button class="btn btn-success w-100">

<i class="bi bi-box-arrow-in-right"></i>

Entrar

</button>

</form>

<div class="footer">

UAN Control Pro • v1.0

</div>

</div>

</body>

</html>
