{% extends "base.html" %}

{% block conteudo %}

<div class="container-fluid">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card card-dashboard p-4">

                <h2 class="fw-bold mb-4">
                    <i class="bi bi-person-plus-fill text-success"></i>

                    {% if usuario %}
                        Editar Usuário
                    {% else %}
                        Novo Usuário
                    {% endif %}
                </h2>

                <form method="POST">

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Nome Completo
                            </label>

                            <input
                                type="text"
                                name="nome"
                                class="form-control"
                                value="{{ usuario.nome if usuario else '' }}"
                                required>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                E-mail
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                value="{{ usuario.email if usuario else '' }}"
                                required>

                        </div>

                    </div>

                    {% if not usuario %}

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Senha
                            </label>

                            <input
                                type="password"
                                name="senha"
                                class="form-control"
                                required>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Perfil
                            </label>

                            <select
                                name="perfil"
                                class="form-select"
                                required>

                                <option value="">Selecione...</option>

                                <option value="Administrador">
                                    Administrador
                                </option>

                                <option value="Nutricionista">
                                    Nutricionista
                                </option>

                                <option value="Almoxarife">
                                    Almoxarife
                                </option>

                                <option value="Estoquista">
                                    Estoquista
                                </option>

                            </select>

                        </div>

                    </div>

                    {% else %}

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Perfil
                            </label>

                            <select
                                name="perfil"
                                class="form-select"
                                required>

                                <option value="Administrador"
                                {% if usuario.perfil=="Administrador" %}selected{% endif %}>
                                    Administrador
                                </option>

                                <option value="Nutricionista"
                                {% if usuario.perfil=="Nutricionista" %}selected{% endif %}>
                                    Nutricionista
                                </option>

                                <option value="Almoxarife"
                                {% if usuario.perfil=="Almoxarife" %}selected{% endif %}>
                                    Almoxarife
                                </option>

                                <option value="Estoquista"
                                {% if usuario.perfil=="Estoquista" %}selected{% endif %}>
                                    Estoquista
                                </option>

                            </select>

                        </div>

                    </div>

                    {% endif %}

                    <div class="form-check mb-4">

                        <input
                            class="form-check-input"
                            type="checkbox"
                            name="ativo"
                            id="ativo"
                            {% if not usuario or usuario.ativo %}checked{% endif %}>

                        <label
                            class="form-check-label"
                            for="ativo">

                            Usuário Ativo

                        </label>

                    </div>

                    <div class="d-flex gap-2">

                        <button
                            class="btn btn-success">

                            <i class="bi bi-check-circle-fill"></i>

                            Salvar

                        </button>

                        <a
                            href="/usuarios"
                            class="btn btn-secondary">

                            Cancelar

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
